<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mediyogi AI — Login & Register</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="login-wrapper">
    <a href="index.html" class="btn btn-secondary btn-sm" style="position:absolute; top:24px; left:24px;">← Back to Home</a>

    <div class="glass-card login-card">
      <div class="brand" style="justify-content:center; margin-bottom:24px;">
        <div class="brand-icon">🩺</div>
        <span>Mediyogi AI</span>
      </div>

      <!-- TOGGLE TABS -->
      <div class="auth-tabs">
        <button id="tab-login-btn" class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
        <button id="tab-reg-btn" class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label>Email or Username</label>
          <input type="text" id="login-user" class="form-control" placeholder="priya.verma@health.in" value="priya.verma@health.in" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" class="form-control" placeholder="••••••••" value="password123" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Sign In</button>
        <button type="button" class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="handleGuestLogin()">⚡ Instant Demo Guest Login</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="auth-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Priya Verma" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-pass" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
